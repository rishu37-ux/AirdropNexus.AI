name: Agent Scheduler (Free GitHub Actions)

on:
  schedule:
    # GitHub scheduled workflows run on UTC. Every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airdropnexus-agent-scheduler
  cancel-in-progress: false

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check deployment secrets
        id: config
        env:
          APP_URL: ${{ secrets.AIRDROPNEXUS_APP_URL }}
          SCHEDULER_SECRET: ${{ secrets.AIRDROPNEXUS_SCHEDULER_SECRET }}
        run: |
          if [ -n "$APP_URL" ] && [ -n "$SCHEDULER_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set repository Actions secrets AIRDROPNEXUS_APP_URL and AIRDROPNEXUS_SCHEDULER_SECRET to connect the timer to the backend."
          fi

      - name: Send scheduler heartbeat to backend
        if: steps.config.outputs.configured == 'true'
        env:
          APP_URL: ${{ secrets.AIRDROPNEXUS_APP_URL }}
          SCHEDULER_SECRET: ${{ secrets.AIRDROPNEXUS_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error             --max-time 20             --request POST             --header "Authorization: Bearer $SCHEDULER_SECRET"             --header "Content-Type: application/json"             --data '{}'             "${APP_URL%/}/api/internal/scheduler/run")"
          echo "$response"
